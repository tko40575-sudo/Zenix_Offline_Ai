<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zenix AI</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            900: '#0b0f19',
                            800: '#131b2e',
                            700: '#1e293b',
                            600: '#334155',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Marked.js for Markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        .message-content pre {
            background: #060911;
            padding: 0.875rem;
            border-radius: 0.5rem;
            overflow-x: auto;
            margin-top: 0.5rem;
            margin-bottom: 0.5rem;
        }
        .message-content code {
            font-family: monospace;
            background: rgba(255,255,255,0.1);
            padding: 0.15rem 0.35rem;
            border-radius: 0.25rem;
            font-size: 0.875em;
        }
        .message-content pre code {
            background: transparent;
            padding: 0;
        }
    </style>
</head>
<body class="bg-dark-900 text-slate-100 h-[100dvh] flex overflow-hidden font-sans">

    <!-- Mobile Sidebar Backdrop -->
    <div id="sidebar-backdrop" onclick="toggleSidebar()" class="fixed inset-0 bg-black/60 backdrop-blur-xs z-30 hidden lg:hidden transition-opacity"></div>

    <!-- Sidebar (ChatGPT / Gemini Style Mobile Drawer) -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-72 bg-dark-800 border-r border-slate-700/50 flex flex-col transform -translate-x-full lg:translate-x-0 lg:static transition-transform duration-300 ease-in-out">
        <!-- Brand Header & New Chat Button -->
        <div class="p-3.5 border-b border-slate-700/50 flex flex-col gap-3">
            <div class="flex items-center justify-between px-1 pt-1">
                <div class="flex items-center space-x-2.5">
                    <img src="https://raw.githubusercontent.com/simple-icons/simple-icons/develop/icons/deepseek.svg" class="w-7 h-7 object-contain" alt="Zenix">
                    <h1 class="font-bold text-base tracking-wide bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent">Zenix AI</h1>
                </div>
                <button onclick="toggleSidebar()" class="lg:hidden text-slate-400 hover:text-white p-1">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <button onclick="createNewChat()" class="w-full flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-500 active:scale-[0.98] text-white font-medium py-2.5 px-4 rounded-xl transition shadow-md text-sm">
                <i data-lucide="plus" class="w-4 h-4"></i> New Chat
            </button>
        </div>

        <!-- Chat History List -->
        <div class="flex-1 overflow-y-auto custom-scrollbar p-3 space-y-1">
            <div class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider px-3 py-1">Recent Chats</div>
            <div id="chat-history-list" class="space-y-1">
                <!-- Dynamically populated chats -->
            </div>
        </div>

        <!-- Sidebar Footer -->
        <div class="p-3 border-t border-slate-700/50 flex flex-col gap-2">
            <button onclick="openSettingsModal()" class="w-full flex items-center justify-between px-3.5 py-3 rounded-xl bg-dark-700/50 hover:bg-dark-700 active:scale-[0.98] text-slate-300 hover:text-white transition text-sm font-medium">
                <span class="flex items-center gap-2.5">
                    <i data-lucide="settings" class="w-4 h-4 text-blue-400"></i> Settings & Add AI
                </span>
                <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400"></i>
            </button>
        </div>
    </aside>

    <!-- Main Chat Area -->
    <main class="flex-1 flex flex-col h-full bg-dark-900 relative min-w-0">
        <!-- Top Navbar -->
        <header class="h-14 sm:h-16 border-b border-slate-700/50 bg-dark-800/60 backdrop-blur-md px-3 sm:px-5 flex items-center justify-between z-10 flex-shrink-0">
            <div class="flex items-center space-x-2.5 min-w-0">
                <button onclick="toggleSidebar()" class="text-slate-400 hover:text-white lg:hidden p-1.5 rounded-lg hover:bg-dark-700">
                    <i data-lucide="menu" class="w-5 h-5"></i>
                </button>
                <div class="flex items-center space-x-2 bg-dark-900/90 border border-slate-700/80 rounded-xl px-2.5 py-1.5 shadow-sm max-w-[200px] sm:max-w-xs">
                    <img id="current-model-icon" src="" class="w-4 h-4 sm:w-5 sm:h-5 rounded-full object-contain flex-shrink-0" alt="Icon">
                    <select id="model-selector" onchange="changeActiveChatModel(this.value)" class="bg-transparent text-xs font-semibold text-slate-200 focus:outline-none cursor-pointer truncate w-full">
                        <!-- Populated dynamically -->
                    </select>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <span class="hidden sm:flex text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2.5 py-1 rounded-full items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> DeepSeek V3
                </span>
            </div>
        </header>

        <!-- Messages Container -->
        <div id="chat-messages" class="flex-1 overflow-y-auto custom-scrollbar p-3 sm:p-6 space-y-4 sm:space-y-6">
            <!-- Welcome View -->
        </div>

        <!-- Input Area -->
        <div class="p-3 sm:p-4 bg-dark-800/90 backdrop-blur-md border-t border-slate-700/50 flex-shrink-0">
            <form id="chat-form" onsubmit="handleSendMessage(event)" class="max-w-4xl mx-auto relative flex items-center">
                <textarea id="user-input" rows="1" placeholder="Message DeepSeek V3..." 
                    class="w-full bg-dark-900 text-slate-100 placeholder-slate-500 rounded-xl pl-3.5 sm:pl-4 pr-12 py-3 sm:py-3.5 text-xs sm:text-sm border border-slate-700 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 resize-none max-h-36 custom-scrollbar"
                    onkeydown="handleKeyDown(event)" oninput="autoResizeTextarea(this)"></textarea>
                <button type="submit" id="send-btn" class="absolute right-2.5 bg-blue-600 hover:bg-blue-500 active:scale-95 text-white p-2 rounded-lg transition shadow-md disabled:opacity-50 disabled:cursor-not-allowed">
                    <i data-lucide="send" class="w-4 h-4"></i>
                </button>
            </form>
            <div class="text-center mt-1.5">
                <span class="text-[10px] sm:text-[11px] text-slate-500">Zenix AI powered by OpenRouter API</span>
            </div>
        </div>
    </main>

    <!-- Settings & Add AI Modal -->
    <div id="settings-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-3 sm:p-4">
        <div class="bg-dark-800 border border-slate-700 rounded-2xl w-full max-w-2xl max-h-[90dvh] flex flex-col shadow-2xl overflow-hidden">
            <!-- Modal Header -->
            <div class="px-5 py-3.5 border-b border-slate-700 flex items-center justify-between bg-dark-800/50 flex-shrink-0">
                <h3 class="font-bold text-base sm:text-lg text-white flex items-center gap-2">
                    <i data-lucide="cpu" class="w-5 h-5 text-blue-400"></i> Settings & Add New AI
                </h3>
                <button onclick="closeSettingsModal()" class="text-slate-400 hover:text-white p-1">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Modal Body -->
            <div class="flex-1 overflow-y-auto custom-scrollbar p-4 sm:p-6 space-y-6">
                <!-- API Key Section -->
                <div class="bg-dark-900/60 p-4 rounded-xl border border-slate-700/60 space-y-3">
                    <h4 class="font-semibold text-sm text-slate-200">OpenRouter API Key</h4>
                    <div class="flex flex-col sm:flex-row gap-2">
                        <input type="password" id="global-api-key" placeholder="sk-or-v1-..." 
                            class="flex-1 bg-dark-900 border border-slate-700 rounded-lg px-3 py-2 text-xs sm:text-sm text-slate-100 focus:outline-none focus:border-blue-500">
                        <button onclick="saveApiKey()" class="bg-blue-600 hover:bg-blue-500 active:scale-[0.98] text-white px-4 py-2 rounded-lg text-xs sm:text-sm font-medium transition flex-shrink-0">Save Key</button>
                    </div>
                </div>

                <!-- Add New AI Section -->
                <div class="border-t border-slate-700/60 pt-5">
                    <div class="flex items-center justify-between mb-3">
                        <h4 id="form-title" class="font-semibold text-sm text-slate-200">Add New AI Model</h4>
                        <button onclick="resetModelForm()" id="cancel-edit-btn" class="hidden text-xs text-blue-400 hover:underline">Cancel Edit</button>
                    </div>
                    <form id="model-creator-form" onsubmit="saveCustomModel(event)" class="space-y-3.5 bg-dark-900/40 p-3.5 sm:p-4 rounded-xl border border-slate-700/60">
                        <input type="hidden" id="edit-model-id">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                            <div>
                                <label class="block text-xs font-medium text-slate-400 mb-1">AI Name</label>
                                <input type="text" id="model-name-input" required placeholder="e.g. GPT-4o" 
                                    class="w-full bg-dark-900 border border-slate-700 rounded-lg px-3 py-2 text-xs sm:text-sm text-slate-100 focus:outline-none focus:border-blue-500">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-400 mb-1">OpenRouter Model ID</label>
                                <input type="text" id="model-string-input" required placeholder="e.g. openai/gpt-4o" 
                                    class="w-full bg-dark-900 border border-slate-700 rounded-lg px-3 py-2 text-xs sm:text-sm text-slate-100 focus:outline-none focus:border-blue-500">
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">Profile Icon Preset or URL</label>
                            <div class="grid grid-cols-5 gap-2 mb-2" id="icon-presets">
                                <!-- Presets injected via JS -->
                            </div>
                            <input type="text" id="model-icon-input" required placeholder="Paste Image URL or click preset above" 
                                class="w-full bg-dark-900 border border-slate-700 rounded-lg px-3 py-2 text-xs sm:text-sm text-slate-100 focus:outline-none focus:border-blue-500">
                        </div>

                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">System Instructions (Optional)</label>
                            <textarea id="model-prompt-input" rows="2" placeholder="You are a helpful expert assistant..." 
                                class="w-full bg-dark-900 border border-slate-700 rounded-lg px-3 py-2 text-xs sm:text-sm text-slate-100 focus:outline-none focus:border-blue-500 resize-none"></textarea>
                        </div>

                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 active:scale-[0.98] text-white font-medium py-2.5 rounded-lg text-xs sm:text-sm transition shadow-lg">
                            Add AI Model
                        </button>
                    </form>
                </div>

                <!-- Active AI Models List -->
                <div class="border-t border-slate-700/60 pt-5">
                    <h4 class="font-semibold text-sm text-slate-200 mb-3">Configured AI Models</h4>
                    <div id="configured-models-list" class="space-y-2">
                        <!-- Populated dynamically -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        const DEFAULT_API_KEY = "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";

        const DEFAULT_MODELS = [
            {
                id: "deepseek-v3",
                name: "DeepSeek V3",
                model: "deepseek/deepseek-chat",
                icon: "https://raw.githubusercontent.com/simple-icons/simple-icons/develop/icons/deepseek.svg",
                systemPrompt: "You are DeepSeek-V3, a helpful and expert AI assistant."
            }
        ];

        const ICON_PRESETS = [
            { name: "DeepSeek", url: "https://raw.githubusercontent.com/simple-icons/simple-icons/develop/icons/deepseek.svg" },
            { name: "OpenAI", url: "https://raw.githubusercontent.com/simple-icons/simple-icons/develop/icons/openai.svg" },
            { name: "Anthropic", url: "https://raw.githubusercontent.com/simple-icons/simple-icons/develop/icons/anthropic.svg" },
            { name: "Google", url: "https://raw.githubusercontent.com/simple-icons/simple-icons/develop/icons/googlegemini.svg" },
            { name: "Meta", url: "https://raw.githubusercontent.com/simple-icons/simple-icons/develop/icons/meta.svg" },
            { name: "Mistral", url: "https://raw.githubusercontent.com/simple-icons/simple-icons/develop/icons/mistralai.svg" },
            { name: "Groq", url: "https://raw.githubusercontent.com/simple-icons/simple-icons/develop/icons/groq.svg" },
            { name: "GitHub", url: "https://raw.githubusercontent.com/simple-icons/simple-icons/develop/icons/github.svg" },
            { name: "Bot", url: "https://api.iconify.design/lucide:bot.svg?color=%233b82f6" },
            { name: "Sparkles", url: "https://api.iconify.design/lucide:sparkles.svg?color=%2360a5fa" }
        ];

        let appState = {
            apiKey: localStorage.getItem('zenix_api_key') || DEFAULT_API_KEY,
            models: JSON.parse(localStorage.getItem('zenix_models')) || DEFAULT_MODELS,
            chats: JSON.parse(localStorage.getItem('zenix_chats')) || [],
            currentChatId: localStorage.getItem('zenix_current_chat') || null
        };

        function refreshIcons() {
            lucide.createIcons();
        }

        function persistState() {
            localStorage.setItem('zenix_api_key', appState.apiKey);
            localStorage.setItem('zenix_models', JSON.stringify(appState.models));
            localStorage.setItem('zenix_chats', JSON.stringify(appState.chats));
            localStorage.setItem('zenix_current_chat', appState.currentChatId);
        }

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('global-api-key').value = appState.apiKey;
            
            if (appState.chats.length === 0) {
                createNewChat();
            } else {
                if (!appState.currentChatId || !appState.chats.find(c => c.id === appState.currentChatId)) {
                    appState.currentChatId = appState.chats[0].id;
                }
                loadChat(appState.currentChatId);
            }

            renderIconPresets();
            renderModelSelector();
            renderChatHistory();
            refreshIcons();
        });

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const backdrop = document.getElementById('sidebar-backdrop');
            sidebar.classList.toggle('-translate-x-full');
            backdrop.classList.toggle('hidden');
        }

        function createNewChat() {
            const newChatId = 'chat_' + Date.now();
            const defaultModel = appState.models[0] ? appState.models[0].id : '';
            const newChat = {
                id: newChatId,
                title: 'New Chat',
                modelId: defaultModel,
                messages: []
            };
            appState.chats.unshift(newChat);
            appState.currentChatId = newChatId;
            persistState();
            renderChatHistory();
            loadChat(newChatId);
            if (window.innerWidth < 1024) {
                toggleSidebar();
            }
        }

        function loadChat(chatId) {
            appState.currentChatId = chatId;
            persistState();
            renderChatHistory();
            renderModelSelector();
            renderMessages();
            if (window.innerWidth < 1024 && !document.getElementById('sidebar').classList.contains('-translate-x-full')) {
                toggleSidebar();
            }
        }

        function deleteChat(chatId, event) {
            event.stopPropagation();
            appState.chats = appState.chats.filter(c => c.id !== chatId);
            if (appState.chats.length === 0) {
                createNewChat();
            } else if (appState.currentChatId === chatId) {
                appState.currentChatId = appState.chats[0].id;
                loadChat(appState.currentChatId);
            }
            persistState();
            renderChatHistory();
        }

        function renderChatHistory() {
            const listEl = document.getElementById('chat-history-list');
            listEl.innerHTML = '';

            appState.chats.forEach(chat => {
                const isActive = chat.id === appState.currentChatId;
                const div = document.createElement('div');
                div.className = `flex items-center justify-between p-2.5 rounded-xl cursor-pointer transition group ${isActive ? 'bg-blue-600/20 border border-blue-500/40 text-white' : 'hover:bg-dark-700/50 text-slate-300'}`;
                div.onclick = () => loadChat(chat.id);
                div.innerHTML = `
                    <div class="flex items-center space-x-2.5 overflow-hidden flex-1">
                        <i data-lucide="message-square" class="w-4 h-4 text-blue-400 flex-shrink-0"></i>
                        <span class="text-xs sm:text-sm truncate">${escapeHtml(chat.title)}</span>
                    </div>
                    <button onclick="deleteChat('${chat.id}', event)" class="lg:opacity-0 group-hover:opacity-100 hover:text-red-400 p-1.5 transition flex-shrink-0">
                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                    </button>
                `;
                listEl.appendChild(div);
            });
            refreshIcons();
        }

        function renderModelSelector() {
            const selectEl = document.getElementById('model-selector');
            selectEl.innerHTML = '';
            
            const chat = getCurrentChat();
            appState.models.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m.id;
                opt.textContent = m.name;
                if (chat && chat.modelId === m.id) {
                    opt.selected = true;
                }
                selectEl.appendChild(opt);
            });
            updateHeaderIcon();
        }

        function updateHeaderIcon() {
            const chat = getCurrentChat();
            if (!chat) return;
            const model = appState.models.find(m => m.id === chat.modelId) || appState.models[0];
            if (model) {
                const iconEl = document.getElementById('current-model-icon');
                iconEl.src = model.icon;
                iconEl.onerror = function() { this.src='https://api.iconify.design/lucide:bot.svg?color=%23ffffff'; };
            }
        }

        function changeActiveChatModel(modelId) {
            const chat = getCurrentChat();
            if (chat) {
                chat.modelId = modelId;
                persistState();
                updateHeaderIcon();
            }
        }

        function getCurrentChat() {
            return appState.chats.find(c => c.id === appState.currentChatId);
        }

        function renderMessages() {
            const container = document.getElementById('chat-messages');
            const chat = getCurrentChat();

            if (!chat || chat.messages.length === 0) {
                const currentModel = appState.models.find(m => m.id === (chat ? chat.modelId : '')) || appState.models[0];
                container.innerHTML = `
                    <div id="welcome-screen" class="h-full flex flex-col items-center justify-center text-center max-w-sm sm:max-w-md mx-auto space-y-4 px-4">
                        <div class="w-14 h-14 sm:w-16 sm:h-16 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center shadow-xl shadow-blue-500/20">
                            <img src="${currentModel ? currentModel.icon : ''}" class="w-8 h-8 sm:w-10 sm:h-10 object-contain" alt="AI">
                        </div>
                        <h3 class="text-lg sm:text-xl font-bold text-white">How can ${currentModel ? currentModel.name : 'AI'} help you today?</h3>
                        <p class="text-xs sm:text-sm text-slate-400">Ask any question, write code, or add custom models in settings.</p>
                    </div>
                `;
                refreshIcons();
                return;
            }

            container.innerHTML = '';
            chat.messages.forEach(msg => {
                const isUser = msg.role === 'user';
                const model = appState.models.find(m => m.id === chat.modelId) || appState.models[0];
                const bubble = document.createElement('div');
                bubble.className = `flex items-start gap-2.5 sm:gap-3 max-w-3xl mx-auto ${isUser ? 'flex-row-reverse' : ''}`;
                
                const avatar = isUser ? 
                    `<div class="w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-blue-600 flex items-center justify-center flex-shrink-0 text-white font-bold text-[11px] sm:text-xs shadow">You</div>` :
                    `<img src="${model ? model.icon : ''}" class="w-7 h-7 sm:w-8 sm:h-8 rounded-full object-contain bg-dark-700 p-0.5 flex-shrink-0" onerror="this.src='https://api.iconify.design/lucide:bot.svg?color=%23ffffff'">`;

                const contentHtml = isUser ? escapeHtml(msg.content) : marked.parse(msg.content);

                bubble.innerHTML = `
                    ${avatar}
                    <div class="flex-1 space-y-1 overflow-hidden min-w-0">
                        <div class="text-[11px] text-slate-400 px-1 ${isUser ? 'text-right' : ''}">${isUser ? 'You' : (model ? model.name : 'AI')}</div>
                        <div class="p-3 sm:p-4 rounded-2xl text-xs sm:text-sm leading-relaxed message-content break-words ${isUser ? 'bg-blue-600 text-white rounded-tr-none' : 'bg-dark-800 border border-slate-700/60 text-slate-100 rounded-tl-none'}">
                            ${contentHtml}
                        </div>
                    </div>
                `;
                container.appendChild(bubble);
            });
            container.scrollTop = container.scrollHeight;
            refreshIcons();
        }

        async function handleSendMessage(e) {
            e.preventDefault();

            const inputEl = document.getElementById('user-input');
            const text = inputEl.value.trim();
            if (!text) return;

            let chat = getCurrentChat();
            if (!chat) {
                createNewChat();
                chat = getCurrentChat();
            }

            if (chat.messages.length === 0) {
                chat.title = text.length > 25 ? text.substring(0, 25) + '...' : text;
            }

            chat.messages.push({ role: 'user', content: text });
            inputEl.value = '';
            inputEl.style.height = 'auto';
            renderMessages();
            renderChatHistory();

            const modelConfig = appState.models.find(m => m.id === chat.modelId) || appState.models[0];
            const messagesPayload = [];
            if (modelConfig && modelConfig.systemPrompt) {
                messagesPayload.push({ role: 'system', content: modelConfig.systemPrompt });
            }
            chat.messages.forEach(m => {
                messagesPayload.push({ role: m.role, content: m.content });
            });

            chat.messages.push({ role: 'assistant', content: '...' });
            renderMessages();

            const sendBtn = document.getElementById('send-btn');
            sendBtn.disabled = true;

            try {
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${appState.apiKey}`,
                        "Content-Type": "application/json",
                        "HTTP-Referer": window.location.href,
                        "X-Title": "Zenix AI"
                    },
                    body: JSON.stringify({
                        model: modelConfig ? modelConfig.model : "deepseek/deepseek-chat",
                        messages: messagesPayload
                    })
                });

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    throw new Error(errData.error?.message || `API Error: ${response.status}`);
                }

                const data = await response.json();
                const reply = data.choices?.[0]?.message?.content || "No response received.";
                chat.messages[chat.messages.length - 1].content = reply;
            } catch (err) {
                chat.messages[chat.messages.length - 1].content = `**Error:** ${err.message}\n\nPlease check your API key or model configuration.`;
            } finally {
                sendBtn.disabled = false;
                persistState();
                renderMessages();
            }
        }

        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                document.getElementById('chat-form').requestSubmit();
            }
        }

        function autoResizeTextarea(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
        }

        // Settings Modal Controls
        function openSettingsModal() {
            document.getElementById('settings-modal').classList.remove('hidden');
            renderConfiguredModelsList();
            if (window.innerWidth < 1024 && !document.getElementById('sidebar').classList.contains('-translate-x-full')) {
                toggleSidebar();
            }
        }

        function closeSettingsModal() {
            document.getElementById('settings-modal').classList.add('hidden');
            resetModelForm();
        }

        function saveApiKey() {
            const key = document.getElementById('global-api-key').value.trim();
            if (!key) {
                alert("Please enter a valid API key.");
                return;
            }
            appState.apiKey = key;
            persistState();
            alert("API Key saved successfully!");
        }

        function renderIconPresets() {
            const container = document.getElementById('icon-presets');
            container.innerHTML = '';
            ICON_PRESETS.forEach(preset => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-dark-800 hover:bg-dark-700 active:scale-95 border border-slate-700 flex items-center justify-center p-2 transition group';
                btn.title = preset.name;
                btn.onclick = () => {
                    document.getElementById('model-icon-input').value = preset.url;
                };
                btn.innerHTML = `<img src="${preset.url}" class="w-full h-full object-contain filter group-hover:scale-110 transition" onerror="this.src='https://api.iconify.design/lucide:bot.svg?color=%23ffffff'">`;
                container.appendChild(btn);
            });
        }

        function renderConfiguredModelsList() {
            const container = document.getElementById('configured-models-list');
            container.innerHTML = '';

            appState.models.forEach(model => {
                const div = document.createElement('div');
                div.className = 'flex items-center justify-between p-3 rounded-xl bg-dark-900 border border-slate-700/60';
                div.innerHTML = `
                    <div class="flex items-center space-x-3 overflow-hidden min-w-0">
                        <img src="${model.icon}" class="w-7 h-7 sm:w-8 sm:h-8 rounded-full object-contain bg-dark-700 p-0.5 flex-shrink-0" onerror="this.src='https://api.iconify.design/lucide:bot.svg?color=%23ffffff'">
                        <div class="truncate min-w-0">
                            <div class="font-medium text-xs sm:text-sm text-white truncate">${escapeHtml(model.name)}</div>
                            <div class="text-[11px] text-slate-400 truncate">${escapeHtml(model.model)}</div>
                        </div>
                    </div>
                    <div class="flex items-center space-x-1.5 flex-shrink-0">
                        <button onclick="editModel('${model.id}')" class="p-2 hover:bg-dark-700 text-slate-400 hover:text-white rounded-lg transition" title="Edit">
                            <i data-lucide="edit-3" class="w-4 h-4"></i>
                        </button>
                        ${appState.models.length > 1 ? `<button onclick="deleteModel('${model.id}')" class="p-2 hover:bg-dark-700 text-slate-400 hover:text-red-400 rounded-lg transition" title="Delete">
                            <i data-lucide="trash" class="w-4 h-4"></i>
                        </button>` : ''}
                    </div>
                `;
                container.appendChild(div);
            });
            refreshIcons();
        }

        function saveCustomModel(e) {
            e.preventDefault();
            const editId = document.getElementById('edit-model-id').value;
            const name = document.getElementById('model-name-input').value.trim();
            const modelString = document.getElementById('model-string-input').value.trim();
            const icon = document.getElementById('model-icon-input').value.trim();
            const systemPrompt = document.getElementById('model-prompt-input').value.trim();

            if (editId) {
                const model = appState.models.find(m => m.id === editId);
                if (model) {
                    model.name = name;
                    model.model = modelString;
                    model.icon = icon;
                    model.systemPrompt = systemPrompt;
                }
            } else {
                const newId = 'model_' + Date.now();
                appState.models.push({
                    id: newId,
                    name,
                    model: modelString,
                    icon,
                    systemPrompt
                });
            }

            persistState();
            renderModelSelector();
            renderConfiguredModelsList();
            resetModelForm();
            closeSettingsModal();
            renderMessages();
        }

        function editModel(id) {
            const model = appState.models.find(m => m.id === id);
            if (!model) return;
            document.getElementById('edit-model-id').value = model.id;
            document.getElementById('model-name-input').value = model.name;
            document.getElementById('model-string-input').value = model.model;
            document.getElementById('model-icon-input').value = model.icon;
            document.getElementById('model-prompt-input').value = model.systemPrompt || '';
            document.getElementById('form-title').textContent = `Edit AI: ${model.name}`;
            document.getElementById('cancel-edit-btn').classList.remove('hidden');
        }

        function resetModelForm() {
            document.getElementById('model-creator-form').reset();
            document.getElementById('edit-model-id').value = '';
            document.getElementById('form-title').textContent = 'Add New AI Model';
            document.getElementById('cancel-edit-btn').classList.add('hidden');
        }

        function deleteModel(id) {
            if (appState.models.length <= 1) {
                alert("You must keep at least one AI model.");
                return;
            }
            if (confirm("Are you sure you want to delete this AI model?")) {
                appState.models = appState.models.filter(m => m.id !== id);
                persistState();
                renderModelSelector();
                renderConfiguredModelsList();
                renderMessages();
            }
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
